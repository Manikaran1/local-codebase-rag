[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-codebase-rag"
version = "0.0.1"
description = "Local-first RAG assistant for software repositories and technical documentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Manikaran" }
]
dependencies = [
  "pathspec>=1.0,<2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "numpy>=2.3,<2.4",
]

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers>=6.1,<7.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
codebase-rag = "codebase_rag.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codebase_rag"]
mypy_path = "src"
